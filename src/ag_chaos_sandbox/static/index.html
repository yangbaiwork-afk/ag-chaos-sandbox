<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ag-Chaos V1.5 Demo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e1e1e; color: white; font-family: sans-serif; display: flex;}

        #viewports-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            transition: all 0.3s ease;
        }

        .viewport-wrapper {
            position: relative;
            flex: 1;
            height: 100%;
            display: flex;
            border-right: 2px solid #444;
            transition: all 0.3s ease;
        }

        .viewport-wrapper.hidden {
            display: none;
            flex: 0;
        }

        .viewport-wrapper:last-child {
            border-right: none;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
        }

        .overlay-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.7);
            border-radius: 8px;
            pointer-events: none; /* Let clicks pass through if needed, but not on buttons */
        }

        .overlay-ui button {
            pointer-events: auto;
        }

        .danger { color: #ff4444; font-weight: bold; }
        .safe { color: #00C851; font-weight: bold; }

        #global-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-action { background: #555; color: white; }
        .btn-spray { background: #007bff; color: white; }
        .btn-cut { background: #dc3545; color: white; }
        .btn-toggle { background: #28a745; color: white; }

        .title-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            padding: 5px 15px;
            border-radius: 5px;
            font-size: 1.2em;
            font-weight: bold;
            color: #ddd;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="viewports-container">
        <!-- 左侧：对照组 (无规则) -->
        <div class="viewport-wrapper" id="vp-no-rules">
            <div class="canvas-container" id="canvas-no-rules"></div>
            <div class="title-badge" style="color: #ff9800;">对照组 (无 Ontology 规则)</div>
            <div class="overlay-ui">
                <p>HP: <span id="hp-no-rules">100</span></p>
                <p>Status: <span id="status-no-rules">Connecting...</span></p>
                <p>距离: <span id="dist-no-rules" style="color: #00ffff; font-weight: bold;">0.0</span> cm</p>
            </div>
        </div>

        <!-- 右侧：实验组 (有规则) -->
        <div class="viewport-wrapper" id="vp-rules">
            <div class="canvas-container" id="canvas-rules"></div>
            <div class="title-badge" style="color: #00C851;">实验组 (有 Ontology 规则保护)</div>
            <div class="overlay-ui">
                <p>HP: <span id="hp-rules">100</span></p>
                <p>Status: <span id="status-rules">Connecting...</span></p>
                <p>距离: <span id="dist-rules" style="color: #00ffff; font-weight: bold;">0.0</span> cm</p>
            </div>
        </div>
    </div>

    <!-- Ontology 动态编辑器 -->
    <div id="ontology-editor" style="position: absolute; right: 20px; top: 70px; background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; width: 300px; z-index: 50; display: flex; flex-direction: column;">
        <h3 style="margin-top: 0; color: #00C851; font-size: 16px;">📜 动态 Ontology 编辑器</h3>
        <p style="font-size: 12px; color: #aaa; margin-bottom: 5px;">在这里修改并应用规则，观察实验组的表现。</p>
        <textarea id="rules-textarea" style="width: 100%; height: 200px; background: #222; color: #00ffcc; border: 1px solid #555; padding: 10px; font-family: monospace; resize: vertical; margin-bottom: 10px;"></textarea>
        <button class="btn" style="background: #00C851; color: white;" onclick="applyRules()">🚀 应用 Ontology 规则</button>
    </div>

    <!-- 全局控制面板 -->
    <div id="global-controls">
        <button class="btn btn-toggle" onclick="toggleViewMode()">🖥️ 切换单/双屏</button>
        <div style="border-left: 1px solid #777; margin: 0 10px;"></div>
        <button class="btn btn-action" onclick="sendAction('Target:0')">🎯 番茄 1</button>
        <button class="btn btn-action" onclick="sendAction('Target:1')">🎯 番茄 2</button>
        <button class="btn btn-action" onclick="sendAction('Target:2')">🎯 番茄 3</button>
        <button class="btn btn-action" onclick="sendAction('Target:-1')">🏠 归位</button>
        <div style="border-left: 1px solid #777; margin: 0 10px;"></div>
        <button class="btn btn-spray" onclick="sendAction('Spray')">💦 喷洒</button>
        <button class="btn btn-cut" onclick="sendAction('Cut')">✂️ 剪除</button>
        <div style="border-left: 1px solid #777; margin: 0 10px;"></div>
        <button class="btn btn-action" onclick="sendAction('Reset')">🔄 重置状态</button>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
